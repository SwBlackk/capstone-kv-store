openapi: 3.0.3
info:
  title: Streaming Service KV-Store API
  description: >-
    Специфікація REST API для розподіленого key-value сховища стрімінгової платформи
    (підтримка профілів, історії переглядів, складених ключів та Consistent Hashing).
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Вузол-координатор (Coordinator Node)
paths:
  /health:
    get:
      summary: Перевірка стану вузла та режиму роботи кластера
      responses:
        '200':
          description: Поточний статус вузла (single-node або sharded)
  /tables:
    post:
      summary: Реєстрація визначення нової таблиці
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - table_name
                - partition_key
              properties:
                table_name:
                  type: string
                  example: watch_history
                partition_key:
                  type: string
                  example: user_id
                sort_key:
                  type: string
                  nullable: true
                  example: timestamp
      responses:
        '201':
          description: Таблицю успішно зареєстровано
    get:
      summary: Отримання списку зареєстрованих таблиць та їхніх схем
      responses:
        '200':
          description: Перелік таблиць
  /shards/register:
    post:
      summary: Автоматична реєстрація вузла-шарда у координаторі при старті
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - node_id
                - url
              properties:
                node_id:
                  type: string
                  example: shard-1
                url:
                  type: string
                  example: http://10.0.11.15:8001
      responses:
        '200':
          description: Шард успішно додано до кільця
  /shards:
    get:
      summary: Стан зареєстрованих шардів та кільця Consistent Hashing
      responses:
        '200':
          description: Список активних шардів і кількість віртуальних вузлів
  /tables/{table_name}/items:
    post:
      summary: CREATE — Збереження пари ключ-значення
      parameters:
        - name: table_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pk
                - value
              properties:
                pk:
                  type: string
                  description: Partition Key
                  example: user_alpha
                sk:
                  type: string
                  nullable: true
                  description: Sort Key (опціонально)
                  example: 2026-11-06T20:15:00
                value:
                  type: object
                  example:
                    show: Stranger Things
                    duration_min: 45
      responses:
        '200':
          description: Запис успішно збережено
  /tables/{table_name}/items/{pk}:
    get:
      summary: READ — Читання значення за ключем або вибірка партиції
      parameters:
        - name: table_name
          in: path
          required: true
          schema:
            type: string
        - name: pk
          in: path
          required: true
          schema:
            type: string
        - name: sk
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Знайдений запис або відсортовані записи партиції
        '404':
          description: Ключ не знайдено
    delete:
      summary: DELETE — Видалення запису за ключем
      parameters:
        - name: table_name
          in: path
          required: true
          schema:
            type: string
        - name: pk
          in: path
          required: true
          schema:
            type: string
        - name: sk
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Запис успішно видалено
        '404':
          description: Ключ не знайдено
  /tables/{table_name}/items/{pk}/exists:
    get:
      summary: EXISTS — Перевірка наявності значення за ключем
      parameters:
        - name: table_name
          in: path
          required: true
          schema:
            type: string
        - name: pk
          in: path
          required: true
          schema:
            type: string
        - name: sk
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Статус існування ключа (exists true/false)